   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(13.920828 416.802551)">Los 40 títulos y sus 386 bloques son idénticos en los cuatro encoders. La referencia uniforme es descriptiva.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(13.920828 427.965012)">Los conjuntos dependen del corpus candidato: el acuerdo no mide exactitud, intensidad emocional ni evolución histórica.</text>
  </g>
 </g>
