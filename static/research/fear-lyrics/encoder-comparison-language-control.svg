  <g id="text_28">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(7.2 423.750551)">Las mismas 40 consultas, los mismos centroides. Se filtra y reordena el ranking, sin traducción ni nuevos embeddings.</text>
