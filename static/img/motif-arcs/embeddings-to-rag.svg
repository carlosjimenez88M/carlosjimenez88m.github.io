   <g id="text_1">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: middle; fill: #17212b" x="97.4016" y="182.208945" transform="rotate(-0 97.4016 182.208945)">1 · Lyric blocks</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(62.844178 205.95951)">Ordered, repeated</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(46.790663 214.961561)">passages stay addressable</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: middle; fill: #17212b" x="264.4416" y="182.208945" transform="rotate(-0 264.4416 182.208945)">2 · Embeddings</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(221.821678 205.95951)">Cosine similarity ranks</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(230.893162 214.961561)">possible evidence</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: middle; fill: #17212b" x="431.4816" y="182.208945" transform="rotate(-0 431.4816 182.208945)">3 · Retrieval</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(399.744295 205.95951)">Lexical or dense;</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(384.887264 214.961561)">then bounded expansion</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: middle; fill: #17212b" x="598.5216" y="182.208945" transform="rotate(-0 598.5216 182.208945)">4 · Chronology</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(558.895233 205.95951)">Restore album order;</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(556.228045 214.961561)">keep voice boundaries</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: middle; fill: #17212b" x="765.5616" y="182.208945" transform="rotate(-0 765.5616 182.208945)">5 · Arc hypothesis</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(727.391873 205.95951)">Repetition, contrast,</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(729.733866 214.961561)">turn, or unresolved</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: middle; fill: #17212b" x="919.2384" y="182.208945" transform="rotate(-0 919.2384 182.208945)">6 · Audit</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(887.463595 205.95951)">Check cited text,</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans', Arial, sans-serif; fill: #617184" transform="translate(883.433517 214.961561)">role, and sequence</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: middle; fill: #17212b" x="261.1008" y="331.488" transform="rotate(-0 261.1008 331.488)">UMAP / PCA: inspect geometry</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: middle; fill: #617184" x="261.1008" y="352.224" transform="rotate(-0 261.1008 352.224)">A projection is not an argument map.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: middle; fill: #17212b" x="758.88" y="331.488" transform="rotate(-0 758.88 331.488)">Candidate links</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: middle; fill: #617184" x="758.88" y="352.224" transform="rotate(-0 758.88 352.224)">A model proposal needs source-level review.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: start; fill: #617184" x="30.5856" y="397.728" transform="rotate(-0 30.5856 397.728)">The experiment measures retrieval exposure and response stability; it does not turn semantic similarity into literary truth.</text>
   </g>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: start; fill: #17212b" x="59.4" y="21.637031" transform="rotate(-0 59.4 21.637031)">From semantic proximity to a defensible reading</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans', Arial, sans-serif; text-anchor: start; fill: #617184" x="59.4" y="41.76" transform="rotate(-0 59.4 41.76)">Embeddings find candidate passages; order and attributed evidence determine what can be claimed.</text>
  </g>
