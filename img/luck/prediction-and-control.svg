   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5d6b75" x="272.736" y="268.5888" transform="rotate(-0 272.736 268.5888)">Illustrative inputs, not classifications of complete outcomes.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5d6b75" x="272.736" y="289.563145" transform="rotate(-0 272.736 289.563145)">Practical control depends on the actor and time horizon.</text>
   </g>
   <g id="text_11">
